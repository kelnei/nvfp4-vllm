[project]
name = "nvfp4-vllm"
version = "0.2.0"
description = "NVFP4 quantization and vLLM serving scripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llmcompressor==0.13.0",
    # llmcompressor 0.13.0 caps transformers at 5.14.1 (PyPI latest is 5.16.x)
    "transformers==5.14.1",
    "vllm==0.28.0",
    "datasets>=4.8.4",
]

[project.optional-dependencies]
# DeltaNet calibration fast path (transformers falls back to a slow torch
# implementation without these). causal-conv1d is an sdist that needs nvcc;
# install with the ~/cuda-13.0 env vars active: uv sync --extra fast-calib
fast-calib = [
    "flash-linear-attention",
    "causal-conv1d",
]

[tool.uv]
# vllm 0.28.0 pins compressed-tensors==0.17.0 while llmcompressor 0.13.0
# pins ==0.18.0; force the newer release so both can resolve. Both agree on
# torch==2.13.0 now, so the old torch override is gone.
override-dependencies = [
    "compressed-tensors==0.18.0",
]
# causal-conv1d's setup.py imports torch, so it cannot build in an isolated
# environment.
no-build-isolation-package = ["causal-conv1d"]
