[project]
name = "nvfp4-vllm"
version = "0.2.0"
description = "NVFP4 quantization and vLLM serving scripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llmcompressor==0.12.0",
    # llmcompressor 0.12.0 caps transformers at 5.10.1
    "transformers==5.10.1",
    "vllm==0.25.1",
    "datasets>=4.8.4",
]

[tool.uv]
# vllm 0.25.1 pins compressed-tensors==0.17.0 while llmcompressor 0.12.0
# pins ==0.17.1; force the newer patch release so both can resolve.
override-dependencies = [
    "compressed-tensors==0.17.1",
]
